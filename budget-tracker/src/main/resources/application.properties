# Application
spring.application.name=Budget Tracker System
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/budget_tracker
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=postgres
spring.datasource.password=admin

# JPA
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# JWT
jwt.secret=mySecretKeyForBudgetTrackerSystemApplicationShouldBeLongEnough
jwt.expiration=86400000

# Logging
logging.level.org.springframework.security=DEBUG
logging.level.com.budget=DEBUG

# Pagination
spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=100